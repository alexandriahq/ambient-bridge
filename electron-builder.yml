appId: com.alexandria.ambient.bridge
productName: Ambient Bridge
electronVersion: 42.6.2
extraMetadata:
  name: ambient-bridge
  main: dist/electron/main.js
directories:
  output: dist-packaged
# Bridge's UI is English-only. Keeping every Chromium locale adds roughly
# 50 MiB to each installed copy without exposing any localized product UI.
electronLanguages:
  - en
  - en-US
  - en-GB
  - en_GB
# Injects the macOS 26/Tahoe Icon Composer icon (Assets.car + CFBundleIconName)
# into the .app before signing. See scripts/afterpack-tahoe-icon.cjs.
afterPack: ./scripts/afterpack-tahoe-icon.cjs
files:
  - dist/**/*
  # Source maps are uploaded before electron-builder runs; they are not runtime
  # files and should never consume installed-app space.
  - "!dist/**/*.map"
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - node_modules/**/*
extraResources:
  # CSS bundles contain font assets without their package license files.
  - from: node_modules/@fontsource-variable/inter/LICENSE
    to: licenses/inter.txt
  - from: node_modules/@fontsource/stix-two-text/LICENSE
    to: licenses/stix-two-text.txt
  - from: node_modules/@fontsource/jetbrains-mono/LICENSE
    to: licenses/jetbrains-mono.txt
  - from: resources/bridge-icon.ico
    to: bridge-icon.ico
  - from: resources/bridge-icon-source.png
    to: bridge-icon-source.png
  - from: resources/bridge-tray-iconTemplate.png
    to: bridge-tray-iconTemplate.png
  - from: resources/bridge-tray-iconTemplate@2x.png
    to: bridge-tray-iconTemplate@2x.png
npmRebuild: false
mac:
  category: public.app-category.productivity
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  icon: resources/bridge-icon.icns
  # Agent-style launch identity: no Dock tile before Electron can apply the
  # runtime accessory policy. Tray + Cmd+Q / tray Quit remain the quit paths.
  extendInfo:
    NSAppleEventsUsageDescription: This app uses Finder to move itself to Trash when you choose Uninstall.
    LSUIElement: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: resources/bridge-icon.ico
  # Must stay true so electron-builder's rcedit step embeds bridge-icon.ico into
  # the packaged .exe; disabling it leaves the stock Electron icon on the
  # executable, taskbar, and Start menu. No signing cert is configured, so
  # electron-builder edits the exe icon but skips signing.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Utility
  # Sized set, not the 1024px source. Ubuntu hicolor does not index 1024x1024/apps.
  icon: build/linux-icons
  target:
    - target: deb
      arch:
        - x64
deb:
  artifactName: ${productName}_${version}_amd64.${ext}
nsis:
  installerIcon: resources/bridge-icon.ico
  uninstallerIcon: resources/bridge-icon.ico
  include: resources/windows-installer.nsh
  oneClick: true
  perMachine: false
publish:
  provider: generic
  url: https://api.alexandria.so/updates/apps/ambient-bridge/alpha/darwin/arm64/
protocols:
  name: Ambient Bridge Auth
  schemes:
    - ambient-bridge
