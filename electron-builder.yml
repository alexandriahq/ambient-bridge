appId: com.alexandria.ambient.bridge
productName: Ambient Bridge
electronVersion: 42.3.3
extraMetadata:
  name: ambient-bridge
  main: dist/electron/main.js
directories:
  output: dist-packaged
# Injects the macOS 26/Tahoe Icon Composer icon (Assets.car + CFBundleIconName)
# into the .app before signing. See scripts/afterpack-tahoe-icon.cjs.
afterPack: ./scripts/afterpack-tahoe-icon.cjs
files:
  - dist/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - node_modules/**/*
extraResources:
  - from: resources/bridge-icon.ico
    to: bridge-icon.ico
  - from: resources/bridge-icon-source.png
    to: bridge-icon-source.png
  - from: resources/bridge-tray-iconTemplate.png
    to: bridge-tray-iconTemplate.png
  - from: resources/bridge-tray-iconTemplate@2x.png
    to: bridge-tray-iconTemplate@2x.png
npmRebuild: false
mac:
  category: public.app-category.productivity
  gatekeeperAssess: false
  hardenedRuntime: true
  icon: resources/bridge-icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: resources/bridge-icon.ico
  # Must stay true so electron-builder's rcedit step embeds bridge-icon.ico into
  # the packaged .exe; disabling it leaves the stock Electron icon on the
  # executable, taskbar, and Start menu. No signing cert is configured, so
  # electron-builder edits the exe icon but skips signing.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: resources/bridge-icon.ico
  uninstallerIcon: resources/bridge-icon.ico
  include: resources/windows-installer.nsh
  oneClick: true
  perMachine: false
publish:
  provider: generic
  url: https://api.alexandria.so/updates/apps/ambient-bridge/alpha/darwin/arm64/
protocols:
  name: Ambient Bridge Auth
  schemes:
    - ambient-bridge
