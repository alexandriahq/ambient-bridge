name: Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Unsigned macOS artifacts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned release artifacts
        run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm release:bundle:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-bridge-macos
          path: |
            dist-packaged/*.dmg
            dist-packaged/*.zip
            dist-packaged/*.blockmap
            dist-packaged/*-mac.yml
            dist-packaged/SHA256SUMS
            dist-packaged/SHA512SUMS
            dist-packaged/artifact-manifest.json

  windows:
    name: Unsigned Windows artifacts
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned release artifacts
        run: pnpm release:bundle:win
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-bridge-windows
          path: |
            dist-packaged/*.exe
            dist-packaged/*.blockmap
            dist-packaged/latest.yml
            dist-packaged/SHA256SUMS
            dist-packaged/SHA512SUMS
            dist-packaged/artifact-manifest.json
