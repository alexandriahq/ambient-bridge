extends: electron-builder.yml
# dev.ps1 supplies the same version used for extraMetadata.version.
win:
  # Avoid electron-builder's cross-platform winCodeSign archive in ordinary
  # Windows shells. The afterPack hook applies the icon and version resources
  # with the Windows-only rcedit package; release/CI builds keep the base path.
  signAndEditExecutable: false
nsis:
  artifactName: ${productName} Setup ${env.AMBIENT_LOCAL_INSTALLER_VERSION}.${ext}
